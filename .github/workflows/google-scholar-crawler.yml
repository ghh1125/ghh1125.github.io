name: Update Google Scholar citation data

on:
  page_build:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Crawl Google Scholar
        working-directory: google_scholar_crawler
        env:
          # The Scholar ID is public; the secret is preferred, with a fallback
          # so a missing/misnamed secret does not prevent the public crawl.
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'S34GF9wAAAAJ' }}
        run: python main.py

      - name: Publish citation data branch
        working-directory: google_scholar_crawler/results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          git init
          git config --local user.name "${ACTOR}"
          git config --local user.email "${ACTOR}@users.noreply.github.com"
          git add *.json
          git commit -m "Update Google Scholar citation data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" HEAD:google-scholar-stats --force
