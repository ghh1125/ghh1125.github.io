name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch Scholar metrics
        run: python scripts/update_scholar_metrics.py

      - name: Commit changed metrics
        run: |
          if git diff --quiet -- scholar-metrics.json; then
            echo "Scholar metrics unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar-metrics.json
          git commit -m "Update Google Scholar metrics [skip ci]"
          git push
